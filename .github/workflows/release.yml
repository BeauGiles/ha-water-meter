name: Release

on:
  release:
    types:
      - published

permissions:
  contents: write

jobs:
  release:
    name: Prepare release
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Create zip
        run: |
          cd custom_components
          zip -r ../water_meter.zip water_meter/

      - name: Upload zip to release
        uses: softprops/action-gh-release@v2
        with:
          files: water_meter.zip
